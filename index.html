
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiggieTalk Wellness Game | Trail B</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #eafffa;
      background: linear-gradient(135deg, #071e20, #10413f, #092b35);
    }

    .container {
      width: 100%;
      max-width: 540px;
      padding: 36px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(168, 255, 230, 0.16);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
    }

    .brand {
      color: #8ee8cf;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .icon {
      margin: 28px 0 12px;
      font-size: 54px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(27px, 6vw, 38px);
    }

    p {
      color: #c9e9e1;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin: 16px 0;
      padding: 9px 15px;
      border: 1px solid #5ac7ae;
      border-radius: 30px;
      color: #b3ffe9;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .date {
      margin-top: 20px;
      color: #8ee8cf;
      font-size: 14px;
    }

    .puzzle {
      margin: 28px 0 18px;
      padding: 24px 16px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(142, 232, 207, 0.35);
      overflow-wrap: anywhere;
    }

    .puzzle-label {
      margin-bottom: 15px;
      color: #8ee8cf;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .code {
      font-family: "Courier New", monospace;
      font-size: clamp(18px, 4vw, 25px);
      line-height: 1.8;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 28px;
      color: #93bcb4;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">BiggieTalk Tayabas</div>
    <div class="icon" id="icon">🔒</div>
    <h1 id="heading">Be Prepared</h1>
    <p id="message">
      The trail is still locked. Stay alert because your challenge is coming soon.
    </p>

    <div class="status" id="status">COMING SOON</div>
    <div class="date" id="date"></div>

    <section class="puzzle hidden" id="puzzle">
      <div class="puzzle-label" id="puzzleLabel"></div>
      <div class="code" id="code"></div>
    </section>

    <div class="footer">
      Observe. Decode. Connect the pieces.
    </div>
  </main>

  <script>
    const START_DATE = "2026-10-26";

    // One coded puzzle is available per day.
    const puzzles = [
      "YVSRMW",
      "13 34 / 11 33 33 24 34 34",
      "01001111 01000110 01000110 01001001 01000011 01000101",
      "01010000 01010010 01001001 01001110 01010100 01000101 01010010"
    ];

    function getLocalDateKey() {
      const now = new Date();

      return [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-");
    }

    function dateToUTC(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      return Date.UTC(year, month - 1, day);
    }

    function updatePage() {
      const today = getLocalDateKey();
      const start = dateToUTC(START_DATE);
      const current = dateToUTC(today);
      const dayNumber = Math.floor((current - start) / 86400000);

      const heading = document.getElementById("heading");
      const message = document.getElementById("message");
      const status = document.getElementById("status");
      const icon = document.getElementById("icon");
      const date = document.getElementById("date");
      const puzzle = document.getElementById("puzzle");
      const puzzleLabel = document.getElementById("puzzleLabel");
      const code = document.getElementById("code");

      puzzle.classList.add("hidden");

      date.textContent = "Launch date: October 26, 2026";

      if (dayNumber < 0) {
        icon.textContent = "🔐";
        heading.textContent = "Be Prepared";
        message.textContent =
          "This trail is not open yet. Be ready to think outside the box when the challenge begins.";
        status.textContent = "COMING SOON";
        return;
      }

      if (dayNumber >= puzzles.length) {
        icon.textContent = "🏁";
        heading.textContent = "Trail Completed";
        message.textContent =
          "The four-day puzzle challenge has ended. Thank you for taking part!";
        status.textContent = "CHALLENGE ENDED";
        return;
      }

      icon.textContent = "🔎";
      heading.textContent = "Decode the Trail";
      message.textContent =
        "Today's code is waiting for you. Figure it out and connect the clues from each day.";
      status.textContent = "PUZZLE " + (dayNumber + 1) + " OF 4";
      puzzleLabel.textContent = "TODAY'S CODE";
      code.textContent = puzzles[dayNumber];
      puzzle.classList.remove("hidden");
    }

    updatePage();

    // Refresh automatically if the date changes while the page stays open.
    setInterval(updatePage, 30000);
  </script>
</body>
</html>
